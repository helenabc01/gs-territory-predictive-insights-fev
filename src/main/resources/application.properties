spring.application.name=territory-predictive-insights-fev

# Banco H2 gravado em ARQUIVO (pasta ./data) para o historico sobreviver ao reiniciar
spring.datasource.url=jdbc:h2:file:./data/territorio
spring.datasource.username=sa
spring.datasource.password=

# Cria/atualiza as tabelas a partir das entidades (@Entity)
spring.jpa.hibernate.ddl-auto=update

# Console web do H2 (opcional, para inspecionar o banco)
spring.h2.console.enabled=true

# Deixa o console do menu limpo (sem o SQL do Hibernate). Mudar para true para depurar.
spring.jpa.show-sql=false
